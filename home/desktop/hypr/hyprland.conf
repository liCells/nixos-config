################
### MONITORS ###
################

# Sunshine/Moonlight headless primary output + physical HDMI dummy fallback.
# The "moonlight" output is created by the exec-once line below before
# Sunshine is (re)started.
monitor = moonlight, 2560x1440@60, 0x0, 1.333333
monitor = HDMI-A-2, 1920x1080@60, 1920x0, 1

workspace = 1, monitor:moonlight, default:true

xwayland {
  force_zero_scaling = true
}

#################
### AUTOSTART ###
#################

# Wallpaper daemon, then apply the remembered wallpaper.
exec-once = awww-daemon
exec-once = sleep 1 && ~/.local/bin/wallpaper.sh

# Top bar.
exec-once = uwsm app -- waybar

# Clipboard history.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# PolicyKit authentication agent.
exec-once = systemctl --user start hyprpolkitagent.service

# Remote desktop: create the headless output, then (re)start Sunshine so it
# picks up the new output. Sunshine may race Hyprland on boot, hence the sleep.
exec-once = hyprctl output create headless moonlight
exec-once = sleep 2 && systemctl --user restart sunshine.service

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(88888888)
    col.inactive_border = rgba(00000088)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    background_color = rgb(21252b)
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 0
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Launch applications.
bind = $mainMod, SPACE, exec, fuzzel
bind = $mainMod, RETURN, exec, alacritty
bind = $mainMod, E, exec, nautilus
bind = $mainMod, B, exec, google-chrome-stable

# Wallpaper picker / random wallpaper / clipboard.
bind = $mainMod, W, exec, waypaper
bind = $mainMod SHIFT, W, exec, ~/.local/bin/wallpaper.sh random
bind = $mainMod, V, exec, ~/.local/bin/clipboard.sh

# Window management.
bind = $mainMod, F, fullscreen,
bind = $mainMod, A, exec, ~/.local/bin/float-center.sh
bind = $mainMod, Q, killactive,

# Focus.
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window.
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Move/resize with mouse.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Switch workspace.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace.
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Exit Hyprland.
bind = $mainMod, M, exit,
